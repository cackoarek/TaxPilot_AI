[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "taxpilot-ai"
version = "0.1.0"
description = "TaxPilot AI - Autonomiczny System Podatkowo-Księgowy dla JDG (KSeF 2.0, Ryczałt, ZUS, VAT, Compliance)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Arkadiusz Cacko" }
]
keywords = ["ksef", "tax", "accounting", "jdg", "vat", "ryczalt", "zus", "compliance", "ai"]
dependencies = [
    "requests>=2.28.0",
    "cryptography>=3.4.8",
    "python-dotenv>=1.0.0",
    "reportlab>=3.6.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "jinja2>=3.1.3",
    "python-multipart>=0.0.9",
    "pydantic>=2.9.0",
    "httpx>=0.28.0",
    "qrcode>=8.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.3.0",
]

[project.scripts]
taxpilot = "src.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.setuptools.package-data]
"src.web" = [
    "templates/**/*.html",
    "static/**/*",
]

[tool.ruff]
line-length = 120
target-version = "py310"
exclude = [
    ".git",
    ".venv",
    "venv",
    "firmy",
    "scratch",
    "build",
    "dist",
    "*.egg-info",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["E402"]
"__init__.py" = ["F401"]
"*/__init__.py" = ["F401"]
