<!-- Top Header & Navigation Bar -->
<header class="bg-slate-900 text-white shadow-md border-b border-slate-800">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="flex items-center justify-between h-16">
      
      <!-- Logo & Tenant Selector -->
      <div class="flex items-center space-x-4">
        <a href="/" class="flex items-center space-x-2 text-white hover:text-blue-400 transition-colors">
          <span class="text-2xl font-black tracking-tight text-blue-500">TaxPilot</span>
          <span class="text-xs uppercase px-1.5 py-0.5 font-bold rounded bg-blue-600 text-white">AI</span>
        </a>

        <!-- Tenant Switcher Dropdown -->
        <form action="/firmy/switch" method="POST" class="inline-flex items-center">
          <input type="hidden" name="redirect_url" value="{{ request.url.path }}">
          <div class="relative inline-block text-left">
            <select name="nip" onchange="this.form.submit()" 
                    class="bg-slate-800 text-slate-100 text-xs font-semibold rounded-lg px-3 py-1.5 border border-slate-700 hover:border-slate-600 focus:outline-none focus:ring-2 focus:ring-blue-500 cursor-pointer">
              {% for comp in all_companies %}
                <option value="{{ comp.nip }}" {% if profile and profile.nip == comp.nip %}selected{% endif %}>
                  🏢 {{ comp.nazwa }} (NIP: {{ comp.nip }})
                </option>
              {% endfor %}
            </select>
          </div>
        </form>
      </div>

      <!-- Period Switcher & LLM Status & Copilot Toggle -->
      <div class="flex items-center space-x-4">
        
        <!-- Period Switcher (Rok / Miesiąc) -->
        <form action="/firmy/period" method="POST" class="flex items-center space-x-1.5 bg-slate-800 px-2 py-1 rounded-lg border border-slate-700">
          <input type="hidden" name="redirect_url" value="{{ request.url.path }}">
          <span class="text-slate-400 text-xs">📅</span>
          <select name="rok" onchange="this.form.submit()" class="bg-transparent text-slate-200 text-xs font-medium focus:outline-none cursor-pointer">
            <option value="2026" {% if rok == '2026' %}selected{% endif %}>2026</option>
            <option value="2025" {% if rok == '2025' %}selected{% endif %}>2025</option>
          </select>
          <span class="text-slate-600 text-xs">/</span>
          <select name="miesiac" onchange="this.form.submit()" class="bg-transparent text-slate-200 text-xs font-medium focus:outline-none cursor-pointer">
            {% for m in ['01', '02', '03', '04', '05', '06', '07', '08', '09', '10', '11', '12'] %}
              <option value="{{ m }}" {% if miesiac == m %}selected{% endif %}>{{ m }}</option>
            {% endfor %}
          </select>
        </form>

        <!-- Dynamiczny Badge LLM -->
        <div>
          {% if llm_available %}
            <span class="inline-flex items-center px-2.5 py-1 rounded-full text-xs font-medium bg-emerald-950 text-emerald-300 border border-emerald-800">
              <span class="w-2 h-2 mr-1.5 bg-emerald-400 rounded-full animate-pulse"></span>
              {{ llm.label }}
            </span>
          {% else %}
            <span class="inline-flex items-center px-2.5 py-1 rounded-full text-xs font-medium bg-slate-800 text-slate-300 border border-slate-700" title="System działa w 100% lokalnie w trybie deterministycznym (Zero-LLM)">
              ⚙️ Deterministyczny (Zero-LLM)
            </span>
          {% endif %}
        </div>

        <!-- Copilot Drawer Button -->
        <button @click="copilotOpen = !copilotOpen" 
                class="inline-flex items-center px-3 py-1.5 text-xs font-semibold rounded-lg bg-indigo-600 hover:bg-indigo-700 text-white shadow transition-all focus:outline-none focus:ring-2 focus:ring-indigo-500">
          <span>💬 Asystent AI</span>
          <span class="ml-1.5 text-indigo-200 text-xs">Ctrl+K</span>
        </button>

      </div>

    </div>
  </div>

  <!-- Główny Pasek Zakładek (Sub-Nav) -->
  <div class="bg-slate-800/90 border-t border-slate-800/80">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <nav class="flex space-x-6 text-sm font-medium">
        <a href="/" class="py-3 px-1 border-b-2 {% if active_tab == 'dashboard' %}border-blue-500 text-blue-400 font-semibold{% else %}border-transparent text-slate-300 hover:text-white hover:border-slate-500{% endif %} transition-colors">
          📊 Pulpit & Przelewy
        </a>
        <a href="/przeglad" class="py-3 px-1 border-b-2 {% if active_tab == 'review' %}border-blue-500 text-blue-400 font-semibold{% else %}border-transparent text-slate-300 hover:text-white hover:border-slate-500{% endif %} transition-colors">
          📝 Przegląd & Kwalifikacja
        </a>
        <a href="/faktury" class="py-3 px-1 border-b-2 {% if active_tab == 'invoices' %}border-blue-500 text-blue-400 font-semibold{% else %}border-transparent text-slate-300 hover:text-white hover:border-slate-500{% endif %} transition-colors">
          📁 Faktury & KSeF 2.0
        </a>
        <a href="/aml" class="py-3 px-1 border-b-2 {% if active_tab == 'aml' %}border-blue-500 text-blue-400 font-semibold{% else %}border-transparent text-slate-300 hover:text-white hover:border-slate-500{% endif %} transition-colors">
          🛡️ Compliance AML & VAT
        </a>
        <a href="/doradca" class="py-3 px-1 border-b-2 {% if active_tab == 'advisor' %}border-blue-500 text-blue-400 font-semibold{% else %}border-transparent text-slate-300 hover:text-white hover:border-slate-500{% endif %} transition-colors">
          💡 Doradca Podatkowy
        </a>
        <a href="/ustawienia" class="py-3 px-1 border-b-2 {% if active_tab == 'settings' %}border-blue-500 text-blue-400 font-semibold{% else %}border-transparent text-slate-300 hover:text-white hover:border-slate-500{% endif %} transition-colors">
          ⚙️ Ustawienia Firmy
        </a>
      </nav>
    </div>
  </div>
</header>
