<!-- Top Header & Navigation Bar -->
<header class="bg-slate-900 text-white shadow-md border-b border-slate-800">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="flex items-center justify-between h-16">
      
      <!-- Logo & Tenant Selector -->
      <div class="flex items-center space-x-4">
        <a href="/" class="flex items-center space-x-2 text-white hover:text-blue-400 transition-colors">
          <span class="text-2xl font-black tracking-tight text-blue-500">TaxPilot</span>
          <span class="text-xs uppercase px-1.5 py-0.5 font-bold rounded bg-blue-600 text-white">AI</span>
        </a>

        <!-- Tenant Switcher Dropdown -->
        <form action="/firmy/switch" method="POST" class="inline-flex items-center">
          <input type="hidden" name="redirect_url" value="{{ request.url.path }}">
          <div class="relative inline-block text-left">
            <select name="nip" onchange="if(this.value==='__NEW__'){ window.location.href='/firmy/nowa'; } else { this.form.submit(); }" 
                    style="color-scheme: dark;"
                    class="dark-select bg-slate-800 text-slate-100 text-xs font-semibold rounded-lg px-3 py-1.5 border border-slate-700 hover:border-slate-600 focus:outline-none focus:ring-2 focus:ring-blue-500 cursor-pointer">
              <optgroup label="Zarejestrowane firmy" class="bg-slate-900 text-slate-400 font-semibold">
                {% for comp in all_companies %}
                  <option value="{{ comp.nip }}" class="bg-slate-800 text-slate-100 py-1" {% if profile and profile.nip == comp.nip %}selected{% endif %}>
                    🏢 {{ comp.nazwa }} (NIP: {{ comp.nip }})
                  </option>
                {% endfor %}
              </optgroup>
              <optgroup label="Zarządzanie firmami" class="bg-slate-900 text-slate-400 font-semibold">
                <option value="__NEW__" class="bg-blue-950 text-blue-300 font-bold py-1.5">
                  ➕ Dodaj nową firmę do księgowania...
                </option>
              </optgroup>
            </select>
          </div>
          <a href="/firmy/nowa" 
             title="Dodaj nową firmę do księgowania" 
             class="ml-1.5 text-slate-400 hover:text-blue-400 hover:bg-slate-800 p-1.5 rounded-lg transition-colors inline-flex items-center text-xs font-bold" 
             aria-label="Dodaj nową firmę">
            ➕
          </a>
        </form>
      </div>

      <!-- Period Switcher & LLM Status & Copilot Toggle -->
      <div class="flex items-center space-x-4">
        
        <!-- Period Switcher (Rok / Miesiąc) -->
        <form action="/firmy/period" method="POST" class="flex items-center space-x-1.5 bg-slate-800/90 hover:bg-slate-800 px-2.5 py-1 rounded-lg border border-slate-700 shadow-inner">
          <input type="hidden" name="redirect_url" value="{{ request.url.path }}">
          <span class="text-blue-400 text-xs select-none">📅</span>
          <select name="rok" onchange="this.form.submit()" 
                  style="color-scheme: dark;"
                  class="dark-select bg-slate-800 text-slate-100 text-xs font-bold rounded px-1.5 py-0.5 border border-slate-700/60 hover:border-slate-500 focus:outline-none focus:ring-1 focus:ring-blue-500 cursor-pointer">
            <option value="2027" class="bg-slate-800 text-slate-100 font-semibold py-1" {% if rok == '2027' %}selected{% endif %}>2027</option>
            <option value="2026" class="bg-slate-800 text-slate-100 font-semibold py-1" {% if rok == '2026' %}selected{% endif %}>2026</option>
            <option value="2025" class="bg-slate-800 text-slate-100 font-semibold py-1" {% if rok == '2025' %}selected{% endif %}>2025</option>
            <option value="2024" class="bg-slate-800 text-slate-100 font-semibold py-1" {% if rok == '2024' %}selected{% endif %}>2024</option>
          </select>
          <span class="text-slate-500 text-xs font-bold select-none">/</span>
          <select name="miesiac" onchange="this.form.submit()" 
                  style="color-scheme: dark;"
                  class="dark-select bg-slate-800 text-slate-100 text-xs font-bold rounded px-1.5 py-0.5 border border-slate-700/60 hover:border-slate-500 focus:outline-none focus:ring-1 focus:ring-blue-500 cursor-pointer">
            {% set months_map = [
              ('01', '01 - Styczeń'),
              ('02', '02 - Luty'),
              ('03', '03 - Marzec'),
              ('04', '04 - Kwiecień'),
              ('05', '05 - Maj'),
              ('06', '06 - Czerwiec'),
              ('07', '07 - Lipiec'),
              ('08', '08 - Sierpień'),
              ('09', '09 - Wrzesień'),
              ('10', '10 - Październik'),
              ('11', '11 - Listopad'),
              ('12', '12 - Grudzień')
            ] %}
            {% for m_val, m_label in months_map %}
              <option value="{{ m_val }}" class="bg-slate-800 text-slate-100 font-semibold py-1" {% if miesiac == m_val %}selected{% endif %}>{{ m_label }}</option>
            {% endfor %}
          </select>
        </form>

        <!-- Dynamiczny Badge LLM -->
        <div>
          {% if llm_available %}
            <span class="inline-flex items-center px-2.5 py-1 rounded-full text-xs font-medium bg-emerald-950 text-emerald-300 border border-emerald-800">
              <span class="w-2 h-2 mr-1.5 bg-emerald-400 rounded-full animate-pulse"></span>
              {{ llm.label }}
            </span>
          {% else %}
            <span class="inline-flex items-center px-2.5 py-1 rounded-full text-xs font-medium bg-slate-800 text-slate-300 border border-slate-700" title="System działa w 100% lokalnie w trybie deterministycznym (Zero-LLM)">
              ⚙️ Deterministyczny (Zero-LLM)
            </span>
          {% endif %}
        </div>

        <!-- Copilot Drawer Button -->
        <button @click="copilotOpen = !copilotOpen" 
                class="inline-flex items-center px-3 py-1.5 text-xs font-semibold rounded-lg bg-indigo-600 hover:bg-indigo-700 text-white shadow transition-all focus:outline-none focus:ring-2 focus:ring-indigo-500">
          <span>💬 Asystent AI</span>
          <span class="ml-1.5 text-indigo-200 text-xs">Ctrl+K</span>
        </button>

      </div>

    </div>
  </div>

  <!-- Główny Pasek Zakładek (Sub-Nav) -->
  <div class="bg-slate-800/90 border-t border-slate-800/80">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <nav class="flex space-x-6 text-sm font-medium overflow-x-auto">
        <a href="/" class="py-3 px-1 border-b-2 whitespace-nowrap {% if active_tab == 'dashboard' %}border-blue-500 text-blue-400 font-semibold{% else %}border-transparent text-slate-300 hover:text-white hover:border-slate-500{% endif %} transition-colors">
          📊 Pulpit & Przelewy
        </a>
        <a href="/faktury" class="py-3 px-1 border-b-2 whitespace-nowrap {% if active_tab == 'invoices' %}border-blue-500 text-blue-400 font-semibold{% else %}border-transparent text-slate-300 hover:text-white hover:border-slate-500{% endif %} transition-colors">
          📁 Faktury & KSeF 2.0
        </a>
        <a href="/przeglad" class="py-3 px-1 border-b-2 whitespace-nowrap {% if active_tab == 'review' %}border-blue-500 text-blue-400 font-semibold{% else %}border-transparent text-slate-300 hover:text-white hover:border-slate-500{% endif %} transition-colors">
          📝 Przegląd i Kwalifikacja
        </a>
        <a href="/aml" class="py-3 px-1 border-b-2 whitespace-nowrap {% if active_tab == 'aml' %}border-blue-500 text-blue-400 font-semibold{% else %}border-transparent text-slate-300 hover:text-white hover:border-slate-500{% endif %} transition-colors">
          🛡️ Compliance AML & VAT
        </a>
        <a href="/ksiegowanie" class="py-3 px-1 border-b-2 whitespace-nowrap {% if active_tab == 'bookkeeping' %}border-blue-500 text-blue-400 font-semibold{% else %}border-transparent text-slate-300 hover:text-white hover:border-slate-500{% endif %} transition-colors">
          📑 Księgowanie
        </a>
        <a href="/doradca" class="py-3 px-1 border-b-2 whitespace-nowrap {% if active_tab == 'advisor' %}border-blue-500 text-blue-400 font-semibold{% else %}border-transparent text-slate-300 hover:text-white hover:border-slate-500{% endif %} transition-colors">
          💡 Doradca Podatkowy
        </a>
        <a href="/ustawienia" class="py-3 px-1 border-b-2 whitespace-nowrap {% if active_tab == 'settings' %}border-blue-500 text-blue-400 font-semibold{% else %}border-transparent text-slate-300 hover:text-white hover:border-slate-500{% endif %} transition-colors">
          ⚙️ Ustawienia Firmy
        </a>
      </nav>
    </div>
  </div>
</header>
