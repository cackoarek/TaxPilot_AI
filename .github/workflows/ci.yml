name: CI - Code Quality & Tests

on:
  push:
    branches: [ main, frontend ]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'pyproject.toml'
      - 'requirements.txt'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [ main, frontend ]

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit test suite
        run: |
          python -m unittest discover -s tests -p "test_*.py"

      - name: Add Step Summary
        if: matrix.python-version == '3.10'
        run: |
          echo "### 🧪 Wyniki testów jednostkowych" >> $GITHUB_STEP_SUMMARY
          echo "Wszystkie testy modułów podatkowych, ZUS, KSeF i UI na Python ${{ matrix.python-version }} zakończyły się sukcesem." >> $GITHUB_STEP_SUMMARY
