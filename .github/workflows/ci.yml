name: CI - Code Quality & Tests

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'tests/**'
      - 'pyproject.toml'
      - 'requirements.txt'
      - '.github/workflows/ci.yml'
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff mypy coverage

      - name: Run Ruff Lint & Format Check
        run: |
          ruff check .
          ruff format --check .

      - name: Run Mypy Type Checking
        run: |
          mypy src/

      - name: Run unit test suite with coverage
        run: |
          coverage run -m unittest discover -s tests -p "test_*.py" -v
          coverage report -m

      - name: Add Step Summary
        run: |
          echo "### 🧪 Wyniki testów jednostkowych i analizy (Python ${{ matrix.python-version }})" >> $GITHUB_STEP_SUMMARY
          echo "- **Status:** ✅ Zakończono sukcesem" >> $GITHUB_STEP_SUMMARY
          echo "- **Statyczna typizacja:** Mypy (strict typing na \`src/\`) bez błędów" >> $GITHUB_STEP_SUMMARY
          echo "- **Jakość kodu:** Ruff lint i format check bez uwag" >> $GITHUB_STEP_SUMMARY
          echo "- **Zakres:** Pełna bateria testów deterministycznych (ZUS, PIT-28, VAT-7, KSeF 2.0, AML, IO atomowe, szyfrowanie at-rest SEC-13, XSS, Upload i UI)" >> $GITHUB_STEP_SUMMARY
