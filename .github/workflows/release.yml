name: Release – Tag & Publish

# Wyzwalany wyłącznie przez tagi w formacie v* (np. v0.2.0, v1.0.0, v1.0.0-rc1)
# Użycie: git tag v0.2.0 -m "Opis wersji" && git push origin v0.2.0
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'  # rc, beta, alpha

permissions:
  contents: write  # wymagane do tworzenia GitHub Release i commitowania wersji

jobs:
  # ------------------------------------------------------------------
  # 1. Wyodrębnienie wersji i walidacja tagu
  # ------------------------------------------------------------------
  prepare:
    name: Prepare Release Metadata
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.extract.outputs.version }}
      tag: ${{ steps.extract.outputs.tag }}
      is_prerelease: ${{ steps.extract.outputs.is_prerelease }}

    steps:
      - name: Extract version from tag
        id: extract
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"   # usuń prefiks 'v'
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

          # Sprawdź czy to pre-release (zawiera myślnik: rc1, beta, alpha)
          if [[ "${VERSION}" == *"-"* ]]; then
            echo "is_prerelease=true" >> $GITHUB_OUTPUT
          else
            echo "is_prerelease=false" >> $GITHUB_OUTPUT
          fi

          echo "🏷️ Tag: ${TAG} | Wersja: ${VERSION}"

  # ------------------------------------------------------------------
  # 2. Testy – weryfikacja przed wydaniem (Quality Gate)
  # ------------------------------------------------------------------
  test:
    name: Tests (pre-release gate)
    runs-on: ubuntu-latest
    needs: prepare

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit test suite
        run: |
          python -m unittest discover -s tests -p "test_*.py"

  # ------------------------------------------------------------------
  # 3. Aktualizacja wersji w plikach projektu i CHANGELOG.md
  # ------------------------------------------------------------------
  bump-version:
    name: Bump Version & Update CHANGELOG
    runs-on: ubuntu-latest
    needs: [prepare, test]
    outputs:
      commit_sha: ${{ steps.commit.outputs.sha }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: main
          fetch-depth: 0  # wymagane do odczytania tagów i historii commitów dla changeloga

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"

      - name: Update version in pyproject.toml
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          sed -i "s/^version = \".*\"/version = \"${VERSION}\"/" pyproject.toml
          echo "✅ pyproject.toml → version = \"${VERSION}\""

      - name: Update VERSION file
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          echo "${VERSION}" > VERSION
          echo "✅ VERSION → ${VERSION}"

      - name: Update CHANGELOG.md
        run: |
          python .github/scripts/update_changelog.py \
            --version "${{ needs.prepare.outputs.version }}" \
            --tag "${{ needs.prepare.outputs.tag }}" \
            --repo "${{ github.repository }}"

      - name: Commit version bump and changelog
        id: commit
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          TAG="${{ needs.prepare.outputs.tag }}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if git diff --quiet; then
            echo "ℹ️ Wersja i changelog już były aktualne – brak zmian do zacommitowania."
            echo "sha=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT
          else
            git add pyproject.toml VERSION CHANGELOG.md
            git commit -m "chore(release): bump version to ${VERSION} and update CHANGELOG [skip ci]"
            git push origin HEAD:main
            echo "sha=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT
            echo "✅ Zacommitowano aktualizację wersji ${VERSION} oraz CHANGELOG.md do main"
          fi

  # ------------------------------------------------------------------
  # 4. Tworzenie GitHub Release z automatycznymi Release Notes
  # ------------------------------------------------------------------
  github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [prepare, bump-version]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Generate Release Notes
        id: notes
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          TAG="${{ needs.prepare.outputs.tag }}"

          # Znajdź poprzedni tag
          PREV_TAG=$(git tag --sort=-version:refname | grep -v "^${TAG}$" | head -n1)
          echo "Poprzedni tag: ${PREV_TAG:-'(brak – pierwsze wydanie)'}"

          cat > /tmp/release_notes.md << EOF
          ## 🚀 TaxPilot AI ${VERSION}

          EOF

          if [ -n "$PREV_TAG" ]; then
            echo "### 📝 Zmiany od ${PREV_TAG}" >> /tmp/release_notes.md
            echo "" >> /tmp/release_notes.md

            FEATURES=$(git log ${PREV_TAG}..${TAG} --pretty=format:"- %s (%h)" --no-merges | grep -E "^- feat" || true)
            FIXES=$(git log ${PREV_TAG}..${TAG} --pretty=format:"- %s (%h)" --no-merges | grep -E "^- fix" || true)
            DOCS=$(git log ${PREV_TAG}..${TAG} --pretty=format:"- %s (%h)" --no-merges | grep -E "^- docs" || true)
            CHORES=$(git log ${PREV_TAG}..${TAG} --pretty=format:"- %s (%h)" --no-merges | grep -E "^- chore|^- ci|^- build|^- refactor|^- test|^- perf" || true)

            if [ -n "$FEATURES" ]; then
              echo "#### ✨ Nowe funkcje" >> /tmp/release_notes.md
              echo "$FEATURES" >> /tmp/release_notes.md
              echo "" >> /tmp/release_notes.md
            fi

            if [ -n "$FIXES" ]; then
              echo "#### 🐛 Poprawki błędów" >> /tmp/release_notes.md
              echo "$FIXES" >> /tmp/release_notes.md
              echo "" >> /tmp/release_notes.md
            fi

            if [ -n "$DOCS" ]; then
              echo "#### 📚 Dokumentacja" >> /tmp/release_notes.md
              echo "$DOCS" >> /tmp/release_notes.md
              echo "" >> /tmp/release_notes.md
            fi

            if [ -n "$CHORES" ]; then
              echo "#### 🔧 Inne zmiany" >> /tmp/release_notes.md
              echo "$CHORES" >> /tmp/release_notes.md
              echo "" >> /tmp/release_notes.md
            fi

            ALL_CATEGORIZED="${FEATURES}${FIXES}${DOCS}${CHORES}"
            if [ -z "$ALL_CATEGORIZED" ]; then
              git log ${PREV_TAG}..${TAG} --pretty=format:"- %s (%h)" --no-merges >> /tmp/release_notes.md
              echo "" >> /tmp/release_notes.md
            fi
          else
            echo "_Pierwsze oficjalne wydanie TaxPilot AI_ 🎉" >> /tmp/release_notes.md
            echo "" >> /tmp/release_notes.md
          fi

          echo "notes_file=/tmp/release_notes.md" >> $GITHUB_OUTPUT

      - name: Add Pages links to Release Notes
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          REPO="${{ github.repository }}"
          OWNER=$(echo "$REPO" | cut -d'/' -f1)
          REPO_NAME=$(echo "$REPO" | cut -d'/' -f2)
          PAGES_BASE="https://${OWNER}.github.io/${REPO_NAME}"

          cat >> /tmp/release_notes.md << EOF

          ---
          ### 📄 Interaktywne Demo WWW (GitHub Pages)

          | Widok / Raport | Bezpośredni link |
          |:---|:---|
          | 📊 Główny Pulpit & Paczka Przelewów | [${PAGES_BASE}/v${VERSION}/index.html](${PAGES_BASE}/v${VERSION}/index.html) |
          | 📝 Wstępny Przegląd i Kwalifikacja | [${PAGES_BASE}/v${VERSION}/web_przeglad.html](${PAGES_BASE}/v${VERSION}/web_przeglad.html) |
          | 📑 Księgowanie & Ewidencja Przychodów | [${PAGES_BASE}/v${VERSION}/web_ksiegowanie.html](${PAGES_BASE}/v${VERSION}/web_ksiegowanie.html) |
          | 📁 Przeglądarka Faktur KSeF & Non-KSeF | [${PAGES_BASE}/v${VERSION}/web_faktury.html](${PAGES_BASE}/v${VERSION}/web_faktury.html) |
          | 🛡️ Compliance AML & Biała Lista VAT | [${PAGES_BASE}/v${VERSION}/web_aml.html](${PAGES_BASE}/v${VERSION}/web_aml.html) |
          | 💡 Doradca Podatkowy (Symulacja) | [${PAGES_BASE}/v${VERSION}/web_doradca.html](${PAGES_BASE}/v${VERSION}/web_doradca.html) |
          | 🔗 Najnowsza wersja demonstracyjna (latest) | [${PAGES_BASE}/latest/](${PAGES_BASE}/latest/) |
          | 🌐 Portal wydań | [${PAGES_BASE}/](${PAGES_BASE}/) |
          EOF

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: "v${{ needs.prepare.outputs.version }}"
          body_path: ${{ steps.notes.outputs.notes_file }}
          prerelease: ${{ needs.prepare.outputs.is_prerelease }}
          make_latest: ${{ needs.prepare.outputs.is_prerelease == 'false' }}
          generate_release_notes: false

  # ------------------------------------------------------------------
  # 5. Publikacja demonstracyjnych widoków panelu webowego na GitHub Pages
  # ------------------------------------------------------------------
  deploy-pages:
    name: Deploy Web Showcase to GitHub Pages
    runs-on: ubuntu-latest
    needs: [prepare, github-release]
    if: always() && needs.github-release.result == 'success'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          path: source

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install dependencies
        working-directory: source
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate static demo pages
        working-directory: source
        run: |
          mkdir -p ../export_output
          python scripts/export_demo_pages.py --output ../export_output

      - name: Checkout gh-pages branch
        uses: actions/checkout@v7
        with:
          ref: gh-pages
          path: pages
          fetch-depth: 0
        continue-on-error: true

      - name: Prepare gh-pages branch structure
        run: |
          if [ ! -d "pages" ] || [ -z "$(ls -A pages 2>/dev/null)" ]; then
            echo "ℹ️ Inicjalizuję nową gałąź gh-pages..."
            mkdir -p pages
            cd pages
            git init
            git checkout --orphan gh-pages
            cd ..
          fi

          TAG="${{ needs.prepare.outputs.tag }}"
          IS_PRERELEASE="${{ needs.prepare.outputs.is_prerelease }}"

          # 1. Kopia dla wersji tagu (np. v0.2.0/)
          mkdir -p "pages/${TAG}"
          rm -rf pages/${TAG}/*
          cp -r export_output/* "pages/${TAG}/"

          # 2. Aktualizacja latest/ (tylko dla pełnych wydań)
          if [ "${IS_PRERELEASE}" = "false" ]; then
            echo "📌 Aktualizuję latest/ → ${TAG}"
            mkdir -p pages/latest
            rm -rf pages/latest/*
            cp -r export_output/* pages/latest/
          fi

          # 3. Regeneracja głównego root index.html
          python source/scripts/generate_portal_index.py \
            --output pages/index.html \
            --version "${TAG}" \
            --repo "${{ github.repository }}"

          # 4. Wyłączenie silnika Jekyll
          touch pages/.nojekyll

      - name: Commit and push to gh-pages
        working-directory: pages
        run: |
          TAG="${{ needs.prepare.outputs.tag }}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if ! git remote | grep -q origin; then
            git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          fi

          git add -A

          if git diff --staged --quiet; then
            echo "ℹ️ Brak zmian do opublikowania na gh-pages."
          else
            git commit -m "docs(pages): deploy web showcase for ${TAG} [skip ci]"
            git push origin HEAD:gh-pages --force
            echo "✅ Opublikowano raporty na gh-pages dla ${TAG}"
          fi
